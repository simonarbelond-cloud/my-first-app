<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Clicks | Colegio Bolívar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h1 {
            color: #123b65;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
        }

        .counter {
            font-size: 80px;
            font-weight: bold;
            color: #123b65;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }

        button:active {
            transform: scale(0.96);
        }

        .click-button {
            background: #123b65;
            color: white;
            width: 100%;
        }

        .click-button:hover {
            background: #1d568b;
        }

        .reset-button {
            background: #e2e8f0;
            color: #334155;
            margin-top: 12px;
        }

        .reset-button:hover {
            background: #cbd5e1;
        }

        .footer {
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Colegio Bolívar</h1>
        <p>Contador interactivo de eventos</p>

        <div class="counter" id="counter" aria-live="polite">0</div>

        <button class="click-button" id="clickButton">
            ¡Haz clic!
        </button>

        <br>

        <button class="reset-button" id="resetButton">
            Reiniciar contador
        </button>

        <p class="footer">Cada clic cuenta. ¡Participa!</p>
    </main>

    <script>
        let clicks = 0;

        const counter = document.getElementById("counter");
        const clickButton = document.getElementById("clickButton");
        const resetButton = document.getElementById("resetButton");

        clickButton.addEventListener("click", function () {
            clicks++;
            counter.textContent = clicks;
        });

        resetButton.addEventListener("click", function () {
            clicks = 0;
            counter.textContent = clicks;
        });
    </script>
</body>
</html>
