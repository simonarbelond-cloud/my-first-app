
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colegio Bolívar | Event Counter</title>

    <link rel="stylesheet" href="style.css">
    <script src="actions.js" defer></script>
</head>

<body>

    <main class="container">

        <div class="badge">EVENTOS · CB</div>

        <header>
            <h1 id="eventTitle">Contador de Eventos</h1>
            <p class="subtitle">COLEGIO BOLÍVAR</p>
        </header>

        <!-- CONFIGURACIÓN DE PARTIDA -->

        <section class="settings">

            <label for="durationSelect">
                DURACIÓN DE LA PARTIDA
            </label>

            <select id="durationSelect">
                <option value="10">10 segundos</option>
                <option value="20">20 segundos</option>
                <option value="30">30 segundos</option>
            </select>

        </section>

        <!-- TEMPORIZADOR -->

        <section class="timer-card">

            <p class="section-label">TIEMPO TRANSCURRIDO</p>

            <div
                id="timer"
                class="timer"
                aria-live="off"
            >00:00.000</div>

            <div class="timer-track">
                <div id="timerProgress" class="timer-progress"></div>
            </div>

        </section>

        <!-- CONTADOR -->

        <section class="counter-card">

            <p class="section-label">CLICKS CONSEGUIDOS</p>

            <div
                id="counter"
                class="counter"
                aria-live="polite"
            >0</div>

            <button
                id="clickButton"
                class="click-button"
                type="button"
                disabled
            >
                + Registrar click
            </button>

        </section>

        <!-- CONTROLES -->

        <section class="controls">

            <button
                id="startButton"
                class="start-button"
                type="button"
            >
                Iniciar partida
            </button>

            <button
                id="resetButton"
                class="reset-button"
                type="button"
            >
                Reiniciar partida
            </button>

        </section>

        <!-- RESULTADO Y NOTIFICACIONES -->

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        >
            Selecciona la duración y comienza tu partida.
        </div>

        <!-- PERSONALIZACIÓN -->

        <section class="customization">

            <label for="titleInput">
                PERSONALIZAR TÍTULO DEL EVENTO
            </label>

            <input
                type="text"
                id="titleInput"
                placeholder="Ej. Feria Empresarial 2026"
                value="Contador de Eventos"
                maxlength="80"
            >

        </section>

        <footer>
            Colegio Bolívar | Event Counter
        </footer>

    </main>

</body>
</html>
